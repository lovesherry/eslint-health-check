project:
  name: eslint-health-check
  description: >
    CLI 工具，用于全面检测 ESLint 配置健康状况，包括 IDE 插件状态、规则冲突、
    依赖版本兼容性、配置文件格式兼容 ESLint 版本等，支持 AI 辅助建议输出。
  type: cli-tool
  language: typescript
  packageModuleType: commonjs

cli:
  entry: bin/index.ts
  command: eslint-health-check
  version: "0.1.0"
  options:
    - flag: "--ai-analysis"
      alias: "-a"
      description: 启用 AI 分析，基于健康检查结果生成智能建议
    - flag: "--json"
      alias: "-j"
      description: 输出原始诊断 JSON 数据

output:
  format: markdown
  fileOutput:
    enabled: true
    default: eslint-health-check-report.md
  structure:
    sections:
      - Node & Environment
      - IDE Plugin Detection
      - ESLint Dependency Analysis
      - Rule Aggregation & Status
      - Rule Conflicts
      - AI Suggestions (when enabled)
  markdown:
    useEmojis: true
    colorStatus: true
    showRuleSources: true

features:
  - detectNodeVersion:
      description: "记录当前环境的node版本，目的是看其是否满足node_modules和IDE中eslint插件对于node版本的要求"
  - detectEslintPluginInIDE:
      supportedIDEs:
        - VSCode
        - WebStorm
        - Cursor
      interactive: true
  - detectConfigFile:
      supported:
        - .eslintrc
        - .eslintrc.json
        - .eslintrc.js
        - eslint.config.js
        - eslint.config.mjs
  - detectConfigFormat:
      description: >
        检测 ESLint 配置文件格式是否与安装版本兼容
      actions:
        - warnIfFlatConfigUsedWithEslintLT9: true
        - warnIfTraditionalConfigUsedWithEslintGTE9: true
  - analyzeRuleUsage:
      description: "提取所有规则，标注来源和启用状态"
  - detectRuleConflicts:
      description: >
        识别规则之间的重叠、冲突，涵盖核心 ESLint、插件、预设及格式化工具
  - checkPluginVersionCompatibility:
      targets:
        - eslint
        - @typescript-eslint/eslint-plugin
        - prettier
        - eslint-plugin-import
        - eslint-plugin-react
      compatibilityMatrix: true
  - analyzeEditorConfig:
      description: "分析 EditorConfig 配置及其与 ESLint/Prettier 的兼容性"
  - analyzePrettierConfig:
      description: "分析 Prettier 配置及其与 ESLint 规则的冲突"
  - generateAiSuggestions:
      description: "基于检查结果生成 AI 智能建议"
      providers:
        - gemini
        - openai

aiSuggestions:
  enabled: true
  outputFormat:
    - markdown
    - json
  structure:
    - title
    - reason
    - suggestedAction
    - riskLevel: [low, medium, high]
    - docsLink
  includes:
    - IDE 插件未检测到或未激活
    - ESLint 相关插件版本过旧或不兼容
    - 缺失推荐核心规则（如 quotes、semi）
    - Prettier 与 ESLint 规则冲突
    - ESLint 9+ 扁平配置迁移建议
    - 未应用的自动修复规则提示
    - EditorConfig 与格式化工具冲突
  environmentVariables:
    - GEMINI_API_KEY
    - OPENAI_API_KEY

architecture:
  directoryLayout:
    src/:
      - modules/
        - nodeInfo/
        - dependenciesAnalyze/
        - eslintConfig/
        - eslintRules/
        - prettierConfig/
        - editorConfig/
        - ideSettings/
        - ideExtensions/
      - cli/
      - llm/
        - gemini/
        - openai/
        - config.ts
        - types.ts
        - analyzer.ts
      - reporters/
      - utils/
      - types/
    bin/:
      - index.ts
    output/:
      - eslint-health-check-report.md
      - eslint-health-check-report.json

pluginSupport:
  supportedPlugins:
    - "@typescript-eslint"
    - "eslint-plugin-prettier"
    - "eslint-plugin-import"
    - "eslint-plugin-react"
    - "eslint-plugin-vue"
    - "eslint-plugin-jsx-a11y"
  allowCustomDetection: true

packaging:
  targetModule: commonjs
  tsconfig:
    compilerOptions:
      module: commonjs
      target: es2020
      outDir: dist
      rootDir: src
      declaration: true
      esModuleInterop: true
      resolveJsonModule: true
      strict: true
      moduleResolution: node
  packageJson:
    main: dist/bin/index.js
    type: commonjs
    bin:
      eslint-health-check: dist/bin/index.js
    peerDependencies:
      eslint: ">=8.0.0 <10.0.0"
    engines:
      node: ">=18.18.0"
    dependencies:
      - "@google/genai"
      - "commander"
      - "eslint"
      - "fast-glob"
      - "inquirer"
      - "js-yaml"
      - "openai"
      - "semver"

workflow:
  preChecks:
    - checkNodeVersion
    - checkEslintInstallation
    - checkPackageJsonVersions
  userInteraction:
    - selectIDE
    - confirmEslintExtension
    - confirmPrettierExtension
  analysis:
    - getNodeEnvironmentInfo
    - analyzeDepCompatibility
    - analyzeEslintConfigFormat
    - aggregateEslintRulesWithAPI
    - aggregatePrettierConfig
    - analyzeEditorConfig
    - getIDESettings
  reporting:
    - generateMarkdownReport
    - generateJsonReport (optional)
    - generateAiAnalysis (optional)

chatgpt:
  role: ESLint健康检测专家
  behavior:
    - 严格遵循规则分析和输出规范
    - 输出分级建议，标注风险等级
    - Markdown中使用 Emoji 与颜色增强可读性
    - 详细解释配置兼容性问题及解决方案
    - 针对规则冲突推荐替代和调整策略
    - 考虑项目运行环境（Node.js 服务端 vs 浏览器端）的特定需求